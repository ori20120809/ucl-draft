<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCL Draft</title>
<style>
:root{--bg:#0a1128;--bg2:#101a3a;--card:#14204a;--line:#25356b;--green:#2eff7b;--text:#ffffff;--muted:#9fb0d9;--red:#ff5d6c;--amber:#ffc857}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.btn{background:var(--green);color:#04210f;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.green{color:var(--green)}
</style>
</head>
<body>
<main class="wrap" id="app">
<h1>UCL <span class="green">DRAFT</span></h1>
<p class="muted">Prototype scaffold. The full app is being uploaded in follow-up commits.</p>
</main>
</body>
</html>
