<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCL Draft</title>
<style>
:root{
  --bg:#0a1128;--bg2:#101a3a;--card:#14204a;--line:#25356b;
  --green:#2eff7b;--green-d:#1fc45c;--text:#ffffff;--muted:#9fb0d9;
  --red:#ff5d6c;--amber:#ffc857;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3{line-height:1.15}
.hidden{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.btn{background:var(--green);color:#04210f;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
.btn:hover{background:#5dffa0;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:rgba(46,255,123,.1)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.green{color:var(--green)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.GK{color:var(--amber);border-color:var(--amber)}
.tag.DEF{color:#6db8ff;border-color:#6db8ff}
.tag.MID{color:var(--green);border-color:var(--green)}
.tag.FWD{color:var(--red);border-color:var(--red)}

/* nav */
header.top{position:sticky;top:0;z-index:50;background:rgba(10,17,40,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:900;font-size:1.2rem;letter-spacing:.5px;cursor:pointer;background:none;border:0}
.logo span{color:var(--green)}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{color:var(--green);background:rgba(46,255,123,.1)}

/* welcome */
.hero{text-align:center;padding:48px 0 24px}
.hero h1{font-size:clamp(2.2rem,8vw,4rem);font-weight:900}
.hero p{max-width:560px;margin:16px auto;color:var(--muted);font-size:1.05rem}
.steps{counter-reset:s}
.steps .card{position:relative;padding-top:38px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:10px;left:14px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#04210f;font-weight:800;display:grid;place-items:center;font-size:.85rem}

/* forms */
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=search],select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.err{color:var(--red);font-size:.9rem;margin-top:6px;min-height:1.2em}

/* draft layout */
.status-bar{position:sticky;top:53px;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line)}
.status-bar .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:8px 16px}
.stat b{font-size:1.15rem}
.stat.low b{color:var(--amber)}
.bar{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.draft-grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:960px){.draft-grid{grid-template-columns:1fr 340px}}
.filters{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.filters .full{grid-column:1/-1}
@media(min-width:600px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters label{margin:0 0 3px;font-size:.78rem;color:var(--muted)}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;transition:border-color .2s,transform .2s,box-shadow .2s}
.pcard.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset;transform:scale(1.01)}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard h3{font-size:1rem}
.rating{font-weight:900;font-size:1.3rem;color:var(--green)}
.price{font-weight:700}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0;text-align:center}
.attrs div{background:var(--bg2);border-radius:6px;padding:3px 0;font-size:.68rem;color:var(--muted)}
.attrs b{display:block;color:var(--text);font-size:.85rem}
.side{align-self:start;position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto}
.sq-group h4{font-size:.8rem;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
.sq-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;background:var(--bg2);border-radius:8px;margin-bottom:4px;font-size:.88rem;animation:pop .25s}
.sq-empty{padding:6px 8px;border:1px dashed var(--line);border-radius:8px;margin-bottom:4px;color:var(--muted);font-size:.82rem}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* pitch */
.pitch{background:linear-gradient(180deg,#0d3b24,#0a2e1c);border:2px solid #1d6b43;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;gap:14px;min-height:420px;justify-content:space-around}
.prow{display:flex;justify-content:space-around;gap:6px}
.slot{flex:1;max-width:130px;min-width:0}
.slot select{font-size:.78rem;padding:6px 4px;text-align:center}
.slot .lbl{font-size:.65rem;text-align:center;color:#8fd6ae;font-weight:700;letter-spacing:.1em}
.slot.bad select{border-color:var(--amber);background:#3a2f10}
.slot.empty select{border-style:dashed}
.slot .cap{width:100%;margin-top:3px;font-size:.68rem;padding:3px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.slot .cap.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:800}
.warn{background:rgba(255,200,87,.12);border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.okmsg{background:rgba(46,255,123,.12);border:1px solid var(--green);color:var(--green);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}

/* match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .big{font-size:1.4rem;font-weight:900;color:var(--muted)}
.score{font-size:clamp(2.5rem,10vw,4.5rem);font-weight:900;text-align:center;animation:pop .5s}
.event{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.disclaimer{font-size:.82rem;color:var(--muted);border-left:3px solid var(--green);padding-left:10px;margin:12px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
tr.me{background:rgba(46,255,123,.12)}
tr.me td:first-child{border-left:3px solid var(--green)}
.res{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;font-size:.75rem;font-weight:800;line-height:22px;color:#04210f}
.res.W{background:var(--green)}.res.L{background:var(--red)}.res.D{background:var(--amber)}
.empty-state{text-align:center;padding:28px;color:var(--muted)}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--green);padding:10px 18px;border-radius:10px;z-index:100;transition:transform .3s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--bg2);border:1px solid var(--line);padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.active{background:var(--green);color:#04210f;border-color:var(--green)}
.screen{animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{padding:24px 16px;text-align:center;color:var(--muted);font-size:.78rem}
</style>
</head>

function weekNumber(){const d=new Date();const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s){state=Object.assign(state,s);
      if(state.league.week!==weekNumber()){state.league={week:weekNumber(),points:0,wins:0,losses:0,draws:0}}
    }
  }catch(e){}
}
const P=id=>PLAYERS.find(p=>p.id===id);
const picked=()=>state.picked.map(P);
const budgetTotal=()=>MODES[state.mode].budget;
const spent=()=>picked().reduce((a,p)=>a+p.price,0);
const remaining=()=>budgetTotal()-spent();
const countPos=pos=>picked().filter(p=>p.pos===pos).length;
const clubCount=c=>picked().filter(p=>p.club===c).length;

function setF(k,v,keepFocus){F[k]=v;renderList();if(!keepFocus){}}
function renderList(){
  const el=$("#plist");if(!el)return;
  const list=filtered();
  if(!list.length){el.innerHTML=`<div class="empty-state card" style="grid-column:1/-1">No players match your filters. <br><button class="btn sm ghost" style="margin-top:10px" onclick="F={q:'',pos:'',club:'',maxPrice:'',minRating:'',sort:'rating'};render()">Reset filters</button></div>`;return}
  el.innerHTML=list.map(cardHTML).join("");
}
function canPick(p){
  if(state.saved)return "Squad is locked";
  if(state.picked.includes(p.id))return "";
  if(state.picked.length>=15)return "Squad is full (15)";
  if(countPos(p.pos)>=SQUAD_LIMITS[p.pos])return `Max ${SQUAD_LIMITS[p.pos]} ${p.pos}`;
  if(p.price>remaining())return `Need ${p.price} cr, only ${remaining()} left`;
  const lim=MODES[state.mode].clubLimit;
  if(clubCount(p.club)>=lim)return `Max ${lim} from ${p.club}`;
  return "";
}
function cardHTML(p){
  const sel=state.picked.includes(p.id),why=canPick(p);
  return `<article class="pcard ${sel?"sel":""}">
    <div class="row"><h3>${esc(p.name)}</h3><span class="rating" title="Game rating">${p.rating}</span></div>
    <div class="row" style="margin-top:4px"><span class="muted" style="font-size:.85rem">${esc(p.club)}</span><span class="tag ${p.pos}">${p.pos}</span></div>
    <div class="attrs">${Object.entries(p.attrs).map(([k,v])=>`<div>${k}<b>${v}</b></div>`).join("")}</div>
    <div class="row"><span class="price">💰 ${p.price} cr</span>
      ${sel?`<button class="btn danger sm" onclick="remove(${p.id})" ${state.saved?"disabled":""}>Remove</button>`
           :`<button class="btn sm" onclick="pick(${p.id})" ${why?"disabled":""} ${why?`title="${esc(why)}"`:""}>Select</button>`}
    </div>
    ${(!sel&&why&&!state.saved)?`<div class="muted" style="font-size:.72rem;margin-top:6px">⛔ ${esc(why)}</div>`:""}
  </article>`;
}
function renderSide(){
  const el= $ ("#sqSide");if(!el)return;
  el.innerHTML=["GK","DEF","MID","FWD"].map(pos=>{
    const ps=picked().filter(p=>p.pos===pos);
    let h=`<div class="sq-group"><h4> $ {POS_NAME[pos]} ${ps.length}/${SQUAD_LIMITS[pos]}</h4>`;
    ps.forEach(p=>h+=`<div class="sq-item"><span>${esc(p.name)} <span class="muted">${p.price}cr</span></span><button class="btn danger sm" onclick="remove(${p.id})" aria-label="Remove ${esc(p.name)}" ${state.saved?"disabled":""}>✕</button></div>`);
    for(let i=ps.length;i<SQUAD_LIMITS[pos];i++)h+=`<div class="sq-empty">Empty slot</div>`;
    return h+"</div>";
  }).join("");
}
